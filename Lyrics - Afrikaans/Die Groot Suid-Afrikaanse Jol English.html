<!DOCTYPE html>
<html lang="af">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Die Groot Suid-Afrikaanse Jol</title>
    <style>
        body {
            background-color: #0d0d0d;
            font-family: Arial, sans-serif;
            color: #FFD700; /* Gold */
            margin: 0;
            padding: 0;
            line-height: 1.5;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 60px 20px;
            text-align: left;
        }

        /* Song Name Heading - 25px */
        h1 {
            font-size: 25px;
            font-weight: bold;
            margin: 0;
            line-height: 1.2;
            white-space: nowrap; /* Prevents the name from breaking into two lines */
        }

        /* English Translation of the Title */
        .title-english {
            font-size: 25px;
            font-weight: normal;
            display: block;
            margin-bottom: 21px; /* Exactly 1 line space (21px) below the full header */
            opacity: 0.9;
        }

        /* Spacing between blocks matched to 21px */
        .lyric-block {
            margin-bottom: 21px;
        }

        /* Main Context Font Size - 21px */
        .afrikaans {
            font-size: 21px;
            font-weight: bold;
            display: block;
        }

        .english {
            font-size: 21px;
            display: block;
            opacity: 0.9;
        }

        .version {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 14px;
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <div class="version">v12</div>

    <div class="container">
        <header>
            <h1>Die Groot Suid-Afrikaanse Jol</h1>
            <span class="title-english">The Great South African Celebration</span>
        </header>

        <main id="lyricsDisplay">
            <!-- Lyrics injected via JavaScript -->
        </main>
    </div>

    <script>
        const lyrics = [
            { af: "Howzit my bru, dit is tyd vir 'n goeie ou kuier", en: "Howzit my brother, it is time for a good old visit" },
            { af: "Jislaaikit, die son sak reeds laag oor die Bosveld en die Srosveld", en: "Gosh, the sun is already setting low over the Bushveld and the Srosveld" },
            { af: "Die outoppie sit by the windpomp in die droë Karoo", en: "The old man sits by the windmill in the dry Karoo" },
            { af: "Hy drink sy Rooibos terwyl die laaitie op die springkasteel 'n bollemakiesie gooi", en: "He drinks his Rooibos while the young boy does a somersault on the jumping castle" },
            { af: "Skat, kry die braaivleis, die boerewors en die biltong reg", en: "Darling, get the barbecue meat, the traditional sausage, and the biltong ready" },
            { af: "Moenie vergeet van die braaibroodjies op die braai nie", en: "Do not forget about the toasted sandwiches on the barbecue" },
            { af: "Boet, gooi nog 'n brannas, ek is moeg vir die bislapad en die plasspad", en: "Brother, pour another brandy, I am tired of the busy road and the farm road" },
            { af: "Ons ry verby die garagepie want die petrol is vrot en die pad is deurmekaar", en: "We drive past the little garage because the petrol is rotten and the road is confusing" },
            { af: "Ai, die ou Van der Merwe is weer hardegat en die voorbok van die dorp", en: "Oh, old Van der Merwe is stubborn again and the leader of the town" },
            { af: "Hayibo, hy is gatvol vir die dinge wat altyd misluk", en: "Good grief, he is fed up with the things that always fail" },
            { af: "Aikona, sê hy, terwyl hy 'n bunnychow eet in die middel van Namakwaland", en: "No way, he says, while he eats a bunnychow in the middle of Namaqualand" },
            { af: "Is zit? vra die bokkie met die snort & trane op haar wange", en: "Is that so? asks the babe with the snot and tears on her cheeks" },
            { af: "Ag shame, sy het haar voet teen 'n klip gestamp en skree \"Eina!\"", en: "Oh shame, she stubbed her foot against a stone and screams \"Ouch\"" },
            { af: "'n Gogga en 'n hottentotsgot kruip suutjiespoeop deur die gras", en: "A bug and a praying mantis crawl quietly through the grass" },
            { af: "Daar is 'n mengelmoes van mense by die jol, dis lekker man", en: "There is a medley of people at the party, it is great man" },
            { af: "Die potjiekos prut in die dotjiakleis, dit ruik na 'n prony how wenner", en: "The pot-food simmers in the clay pot, it smells like a prize-winning show winner" },
            { af: "Moenie so dof wees nie, sommer net vasbyt en aanhou loop", en: "Do not be so dim-witted, just hang in there and keep walking" },
            { af: "Iemand raak lafvol en begin soos 'n loslappie dans", en: "Someone gets full of nonsense and starts dancing like a carefree person" },
            { af: "Môreoggend het ons almal 'n babelaas en dronkverdriet", en: "Tomorrow morning we all have a hangover and drunken sorrow" },
            { af: "Bliksem, dit was 'n lang pad van die Senqu rivier af", en: "Damn, it was a long road from the Senqu river" },
            { af: "Voetsek! skree die buurman vir die hond, maar ons hou net aan sing", en: "Get lost! the neighbor screams at the dog, but we just keep on singing" },
            { af: "Dis mos hoe ons dit doen, van die Kaap tot in die verste noorde", en: "That is just how we do it, from the Cape to the furthest north" }
        ];

        function init() {
            const main = document.getElementById('lyricsDisplay');
            lyrics.forEach(item => {
                const block = document.createElement('div');
                block.className = 'lyric-block';
                
                const afLine = document.createElement('span');
                afLine.className = 'afrikaans';
                afLine.textContent = item.af;
                
                const enLine = document.createElement('span');
                enLine.className = 'english';
                enLine.textContent = item.en;
                
                block.appendChild(afLine);
                block.appendChild(enLine);
                main.appendChild(block);
            });
        }

        window.onload = init;
    </script>
</body>
</html>
